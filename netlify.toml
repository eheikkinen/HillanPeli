[build]
  command = "sh tools/build.sh"
  publish = "dist"

# Peli päivittyy aina: selain tarkistaa uuden version joka latauksella
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
